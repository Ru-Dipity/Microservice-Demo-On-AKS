# =============================================================================
# Monitoring Helm Chart — unified monitoring stack configuration
# =============================================================================

# Image pull policy
imagePullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Ingress configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  prometheusHost: "prometheus.lukas.cloud-ip.cc"
  grafanaHost: "grafana.lukas.cloud-ip.cc"
  tls:
    enabled: false
    secretName: ""

# -----------------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------------
prometheus:
  enabled: true
  image: prom/prometheus:v2.52.0
  replicas: 1
  retention: 7d
  scrapeInterval: 15s
  evaluationInterval: 15s
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

# -----------------------------------------------------------------------------
# Grafana
# -----------------------------------------------------------------------------
grafana:
  enabled: true
  image: grafana/grafana:10.4.2
  replicas: 1
  adminUser: admin
  adminPassword: admin123
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# -----------------------------------------------------------------------------
# Node Exporter
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true
  image: prom/node-exporter:v1.8.0
  resources:
    requests: { cpu: 10m, memory: 20Mi }
    limits:   { cpu: 50m, memory: 50Mi }