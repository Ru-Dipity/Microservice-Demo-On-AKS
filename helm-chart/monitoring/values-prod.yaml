# =============================================================================
# Monitoring — prod 环境覆盖
# =============================================================================

namespace: monitoring-prod

ingress:
  enabled: true
  className: nginx
  prometheusHost: sockshop-prod.prometheus.lukas.cloud-ip.cc    # <-- 留空，用户自行填写
  grafanaHost: sockshop-prod.grafana.lukas.cloud-ip.cc      # <-- 留空，用户自行填写
  tls:
    enabled: true
    secretName: monitoring-tls   # 用户自行创建 TLS Secret

prometheus:
  replicas: 1
  retention: 15d
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }

grafana:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

nodeExporter:
  enabled: true
