# =============================================================================
# Sock Shop — dev environment overrides
# Deploy: helm upgrade --install sock-shop ./helm-chart/sock-shop \
#         -f helm-chart/sock-shop/values-dev.yaml -n sock-shop-dev --create-namespace
# =============================================================================

namespace: sock-shop-dev

ingress:
  enabled: true
  className: nginx
  host: sockshop-dev.lukas.cloud-ip.cc            # <-- leave empty; fill in your own value (e.g. sockshop-dev.lukas.cloud-ip.cc)
  tls:
    enabled: false
    secretName: ""

# dev environment: single replica, smaller resource requests
services:
  carts:
    replicas: 1
  catalogue:
    replicas: 1
  front-end:
    replicas: 1
  orders:
    replicas: 1
  payment:
    replicas: 1
  queue-master:
    replicas: 1
  rabbitmq:
    replicas: 1
  shipping:
    replicas: 1
  user:
    replicas: 1
