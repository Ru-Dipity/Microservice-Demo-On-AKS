{{ $svc := index .Values.services "orders-db" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: {{ include "sock-shop.namespace" . }}
  labels:
    name: orders-db
    {{- include "sock-shop.labels" . | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      name: orders-db
  template:
    metadata:
      labels:
        name: orders-db
    spec:
      containers:
        - name: orders-db
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: mongo
              containerPort: {{ $svc.port }}
          {{- if $svc.securityContext }}
          securityContext:
            {{- toYaml $svc.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  labels:
    name: orders-db
    {{- include "sock-shop.labels" . | nindent 4 }}
  namespace: {{ include "sock-shop.namespace" . }}
spec:
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
  selector:
    name: orders-db
