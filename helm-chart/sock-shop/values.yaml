# =============================================================================
# Sock Shop Helm Chart — 默认 values（作为 dev 基准）
# 通过 values-dev.yaml / values-prod.yaml 覆盖环境差异
# =============================================================================

# 命名空间（dev/prod 可通过 values 覆盖为 sock-shop-dev / sock-shop-prod）
namespace: sock-shop

# 全局镜像拉取策略
imagePullPolicy: IfNotPresent

# 节点选择器（Linux 节点）
nodeSelector:
  kubernetes.io/os: linux

# -----------------------------------------------------------------------------
# Ingress 配置
# host 留空，用户后续自行填写（如 sockshop.lukas.cloud-ip.cc）
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: ""            # <-- 留空，用户自行填写
  tls:
    enabled: false
    secretName: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  catalogueDbPassword: admin   # catalogue-db MySQL root 密码

# -----------------------------------------------------------------------------
# 服务定义
# 每个服务包含：image / replicas / resources / env / probes / ports / scrape
# -----------------------------------------------------------------------------
services:
  carts:
    image: weaveworksdemos/carts:0.4.8
    replicas: 1
    port: 80
    scrape: "true"
    env:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
      SPRING_DATA_MONGODB_HOST: carts-db
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: data
    resources:
      requests: { cpu: 100m, memory: 200Mi }
      limits:   { cpu: 300m, memory: 500Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true

  carts-db:
    image: mongo:4.4
    replicas: 1
    port: 27017
    scrape: "false"
    resources:
      requests: {}
      limits: {}
    securityContext:
      capabilities:
        drop: ["all"]
        add: ["CHOWN", "SETGID", "SETUID"]
      readOnlyRootFilesystem: true

  catalogue:
    image: weaveworksdemos/catalogue:0.3.5
    replicas: 1
    port: 80
    scrape: "true"
    command: ["/app"]
    args: ["-port=80"]
    resources:
      requests: { cpu: 100m, memory: 100Mi }
      limits:   { cpu: 200m, memory: 200Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 300
        periodSeconds: 3
      readiness:
        path: /health
        initialDelaySeconds: 180
        periodSeconds: 3

  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0
    replicas: 1
    port: 3306
    scrape: "false"
    env:
      MYSQL_DATABASE: socksdb
    resources:
      requests: {}
      limits: {}

  front-end:
    image: weaveworksdemos/front-end:0.3.12
    replicas: 1
    port: 8079
    servicePort: 80
    scrape: "true"
    env:
      SESSION_REDIS: "true"
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits:   { cpu: 300m, memory: 1000Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
      readOnlyRootFilesystem: true
    probes:
      liveness:
        path: /
        initialDelaySeconds: 300
        periodSeconds: 3
      readiness:
        path: /
        initialDelaySeconds: 30
        periodSeconds: 3

  orders:
    image: weaveworksdemos/orders:0.4.7
    replicas: 1
    port: 80
    scrape: "true"
    env:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
      SPRING_DATA_MONGODB_HOST: orders-db
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: data
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits:   { cpu: 500m, memory: 500Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true

  orders-db:
    image: mongo:4.4
    replicas: 1
    port: 27017
    scrape: "false"
    resources:
      requests: {}
      limits: {}
    securityContext:
      capabilities:
        drop: ["all"]
        add: ["CHOWN", "SETGID", "SETUID"]
      readOnlyRootFilesystem: true

  payment:
    image: weaveworksdemos/payment:0.4.3
    replicas: 1
    port: 80
    scrape: "true"
    resources:
      requests: { cpu: 99m, memory: 100Mi }
      limits:   { cpu: 200m, memory: 200Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 300
        periodSeconds: 3
      readiness:
        path: /health
        initialDelaySeconds: 180
        periodSeconds: 3

  queue-master:
    image: weaveworksdemos/queue-master:0.3.1
    replicas: 1
    port: 80
    scrape: "false"
    env:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits:   { cpu: 300m, memory: 500Mi }

  rabbitmq:
    image: rabbitmq:3.6.8-management
    replicas: 1
    scrape: "false"
    ports:
      - { name: management, containerPort: 15672 }
      - { name: rabbitmq, containerPort: 5672 }
    servicePorts:
      - { name: rabbitmq, port: 5672, targetPort: 5672 }
      - { name: exporter, port: 9419, targetPort: exporter, protocol: TCP }
    exporterImage: kbudde/rabbitmq-exporter
    resources:
      requests: {}
      limits: {}
    securityContext:
      capabilities:
        drop: ["all"]
        add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE"]
      readOnlyRootFilesystem: true

  session-db:
    image: redis:alpine
    replicas: 1
    port: 6379
    scrape: "false"
    args: ["--save", "", "--appendonly", "no"]
    resources:
      requests: {}
      limits: {}
    securityContext:
      capabilities:
        drop: ["all"]
        add: ["CHOWN", "SETGID", "SETUID"]
      readOnlyRootFilesystem: true

  shipping:
    image: weaveworksdemos/shipping:0.4.8
    replicas: 1
    port: 80
    scrape: "true"
    env:
      ZIPKIN: zipkin.jaeger.svc.cluster.local
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits:   { cpu: 300m, memory: 500Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true

  user:
    image: weaveworksdemos/user:0.4.7
    replicas: 1
    port: 80
    scrape: "true"
    env:
      mongo: user-db:27017
    resources:
      requests: { cpu: 100m, memory: 100Mi }
      limits:   { cpu: 300m, memory: 200Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      capabilities:
        drop: ["all"]
        add: ["NET_BIND_SERVICE"]
      readOnlyRootFilesystem: true
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 300
        periodSeconds: 3
      readiness:
        path: /health
        initialDelaySeconds: 180
        periodSeconds: 3

  user-db:
    image: weaveworksdemos/user-db:0.3.0
    replicas: 1
    port: 27017
    scrape: "false"
    resources:
      requests: {}
      limits: {}
    securityContext:
      capabilities:
        drop: ["all"]
        add: ["CHOWN", "SETGID", "SETUID"]
      readOnlyRootFilesystem: true
