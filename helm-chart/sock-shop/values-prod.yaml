# =============================================================================
# Sock Shop — prod 环境覆盖
# 部署：helm upgrade --install sock-shop ./helm-chart/sock-shop \
#         -f helm-chart/sock-shop/values-prod.yaml -n sock-shop-prod --create-namespace
# =============================================================================

namespace: sock-shop-prod

ingress:
  enabled: true
  className: nginx
  host: ""            # <-- 留空，用户自行填写（如 sockshop.lukas.cloud-ip.cc）
  tls:
    enabled: true
    secretName: sockshop-tls   # 用户自行创建 TLS Secret

# prod 环境：关键服务多副本、资源请求更大
services:
  carts:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 300Mi }
      limits:   { cpu: 500m, memory: 800Mi }
  catalogue:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 200Mi }
      limits:   { cpu: 500m, memory: 400Mi }
  front-end:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 500Mi }
      limits:   { cpu: 500m, memory: 1500Mi }
  orders:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 400Mi }
      limits:   { cpu: 1000m, memory: 1000Mi }
  payment:
    replicas: 2
  queue-master:
    replicas: 1
  rabbitmq:
    replicas: 1
  shipping:
    replicas: 2
  user:
    replicas: 2
