# =============================================================================
# Sock Shop CI/CD pipeline (Terraform + Helm deploy)
# Trigger: push to main (terraform/ or helm-chart/ or workflow changes) / manual
# Flow: Terraform provision -> Helm lint & template validation -> deploy to AKS
# =============================================================================
name: Sock Shop CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'helm-chart/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  TF_IN_AUTOMATION: true
  # Dynamically parse fields from the existing AZURE_CREDENTIALS JSON
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Provision / update the AKS infrastructure with Terraform
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # 2. Validate the Helm charts (independent of infrastructure)
  # ---------------------------------------------------------------------------
  lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint - sock-shop
        run: helm lint helm-chart/sock-shop

      - name: Helm Lint - monitoring
        run: helm lint helm-chart/monitoring

      - name: Helm Template Render Validation (dev)
        run: |
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-dev.yaml > /dev/null
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-prod.yaml > /dev/null
          helm template monitoring helm-chart/monitoring -f helm-chart/monitoring/values.yaml > /dev/null
          echo "sock-shop dev rendered successfully"
          echo "sock-shop prod rendered successfully"
          echo "monitoring rendered successfully"

  # ---------------------------------------------------------------------------
  # 3. Deploy the application to AKS (after infra + lint both succeed)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [terraform, lint]
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CLUSTER_NAME: ${{ secrets.AZURE_CLUSTER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin for Azure auth
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.3'

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Deploy Monitoring stack
        run: |
          helm upgrade --install monitoring helm-chart/monitoring \
            -f helm-chart/monitoring/values.yaml \
            --namespace monitoring \
            --create-namespace \
            --wait --timeout 5m

      - name: Deploy Sock Shop microservices
        run: |
          helm upgrade --install sock-shop helm-chart/sock-shop \
            -f helm-chart/sock-shop/values-${{ env.DEPLOY_ENV }}.yaml \
            --namespace sock-shop-${{ env.DEPLOY_ENV }} \
            --create-namespace \
            --wait --timeout 10m

      - name: Verify Pod status
        run: |
          echo "=== Monitoring Pods ==="
          kubectl get pods -n monitoring
          echo "=== Sock Shop Pods (${{ env.DEPLOY_ENV }}) ==="
          kubectl get pods -n sock-shop-${{ env.DEPLOY_ENV }}
