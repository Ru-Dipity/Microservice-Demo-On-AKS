# =============================================================================
# Sock Shop 应用部署流水线
# 触发：push 到 main / 手动触发
# 流程：Helm Lint 校验 -> Helm Template 渲染校验 -> 部署到 AKS
# =============================================================================
name: Deploy Sock Shop to AKS

on:
  push:
    branches: [main]
    paths:
      - 'helm-chart/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境 (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  lint:
    name: Helm Lint & Template 校验
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint - sock-shop
        run: helm lint helm-chart/sock-shop

      - name: Helm Lint - monitoring
        run: helm lint helm-chart/monitoring

      - name: Helm Template 渲染校验 (dev)
        run: |
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-dev.yaml > /dev/null
          helm template monitoring helm-chart/monitoring -f helm-chart/monitoring/values-dev.yaml > /dev/null
          echo "sock-shop dev 渲染成功"
          echo "monitoring dev 渲染成功"

      - name: Helm Template 渲染校验 (prod)
        run: |
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-prod.yaml > /dev/null
          helm template monitoring helm-chart/monitoring -f helm-chart/monitoring/values-prod.yaml > /dev/null
          echo "sock-shop prod 渲染成功"
          echo "monitoring prod 渲染成功"

  deploy:
    name: 部署到 AKS
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CLUSTER_NAME: ${{ secrets.AZURE_CLUSTER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin for Azure auth
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.3'

      - name: 获取 AKS 凭据
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: 部署 Monitoring 基础监控
        run: |
          helm upgrade --install monitoring helm-chart/monitoring \
            -f helm-chart/monitoring/values.yaml \
            --namespace monitoring \
            --create-namespace \
            --wait --timeout 5m

      - name: 部署 Sock Shop 微服务
        run: |
          helm upgrade --install sock-shop helm-chart/sock-shop \
            -f helm-chart/sock-shop/values-${{ env.DEPLOY_ENV }}.yaml \
            --namespace sock-shop-${{ env.DEPLOY_ENV }} \
            --create-namespace \
            --wait --timeout 5m

      - name: 验证 Pod 状态
        run: |
          echo "=== Monitoring Pods ==="
          kubectl get pods -n monitoring
          echo "=== Sock Shop Pods (${{ env.DEPLOY_ENV }}) ==="
          kubectl get pods -n sock-shop-${{ env.DEPLOY_ENV }}