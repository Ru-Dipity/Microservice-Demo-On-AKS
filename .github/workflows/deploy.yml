# =============================================================================
# Sock Shop application deployment pipeline
# Trigger: push to main / manual trigger / after Terraform Infrastructure succeeds
# Flow: Helm Lint validation -> Helm Template render validation -> deploy to AKS
# =============================================================================
name: Deploy Sock Shop to AKS

on:
  push:
    branches: [main]
    paths:
      - 'helm-chart/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  # Automatically run after the Terraform Infrastructure workflow completes
  # successfully, ensuring the AKS cluster exists before deploying the app.
  workflow_run:
    workflows: ['Terraform Infrastructure']
    types:
      - completed

jobs:
  lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint - sock-shop
        run: helm lint helm-chart/sock-shop

      - name: Helm Lint - monitoring
        run: helm lint helm-chart/monitoring

      - name: Helm Template Render Validation (dev)
        run: |
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-dev.yaml > /dev/null
          helm template sock-shop helm-chart/sock-shop -f helm-chart/sock-shop/values-prod.yaml > /dev/null
          helm template monitoring helm-chart/monitoring -f helm-chart/monitoring/values.yaml > /dev/null
          echo "sock-shop dev rendered successfully"
          echo "sock-shop prod rendered successfully"
          echo "monitoring rendered successfully"

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CLUSTER_NAME: ${{ secrets.AZURE_CLUSTER_NAME }}
    steps:
      # When triggered by workflow_run, only proceed if the upstream
      # Terraform Infrastructure workflow completed successfully.
      - name: Verify upstream Terraform workflow succeeded
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Upstream Terraform Infrastructure workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Aborting deploy."
            exit 1
          fi
          echo "Upstream Terraform Infrastructure workflow succeeded. Proceeding with deploy."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin for Azure auth
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.3'

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Deploy Monitoring stack
        run: |
          helm upgrade --install monitoring helm-chart/monitoring \
            -f helm-chart/monitoring/values.yaml \
            --namespace monitoring \
            --create-namespace \
            --wait --timeout 5m

      - name: Deploy Sock Shop microservices
        run: |
          helm upgrade --install sock-shop helm-chart/sock-shop \
            -f helm-chart/sock-shop/values-${{ env.DEPLOY_ENV }}.yaml \
            --namespace sock-shop-${{ env.DEPLOY_ENV }} \
            --create-namespace \
            --wait --timeout 10m

      - name: Verify Pod status
        run: |
          echo "=== Monitoring Pods ==="
          kubectl get pods -n monitoring
          echo "=== Sock Shop Pods (${{ env.DEPLOY_ENV }}) ==="
          kubectl get pods -n sock-shop-${{ env.DEPLOY_ENV }}