# ----------------------------------------------------------------------------
# Optional: standalone Helm values for Prometheus if you choose to install it
# *separately* from kube-prometheus-stack.
#
# For this Sock Shop demo the recommended path is kube-prometheus-stack (which
# ships Prometheus + Alertmanager + Grafana + kube-state-metrics + node
# exporter together).  Use this chart ONLY when you want the minimal
# Prometheus install without the rest of the stack.
# ----------------------------------------------------------------------------

server:
  # Single replica — HA not required for the demo.
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: v2.52.0
    pullPolicy: IfNotPresent

  # Retention policies — keep samples 15 days, or until disk reaches 30 GB.
  retention: "15d"
  retentionSize: "30GB"

  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s
    external_labels:
      cluster: sock-shop-aks
      environment: demo

  # Resource caps to avoid starving application Pods.
  resources:
    requests:
      cpu: 1
      memory: 4Gi
    limits:
      cpu: 4
      memory: 12Gi

  # Persistent storage on AKS managed-csi (Azure Disk).
  persistentVolume:
    enabled: true
    storageClass: managed-csi
    accessModes:
      - ReadWriteOnce
    size: 50Gi

  # Service for in-cluster access (Grafana datasource, alerts, etc.).
  service:
    type: ClusterIP
    servicePort: 9090
    targetPort: 9090

  # Ingress to reach the Prometheus UI.
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - prometheus.sock-shop.example.com
    paths:
      - "/"
    pathType: Prefix
    # tls: []

  # Scrapes: kube SD for Pods + Services with prometheus.io annotations,
  # plus a static target for Prometheus self-metrics.
  scrapeConfigs:
    - job_name: prometheus
      static_configs:
        - targets: ["localhost:9090"]
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
    - job_name: kubernetes-services
      kubernetes_sd_configs:
        - role: service
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"

# Alertmanager — lightweight, single replica.
alertmanager:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  persistentVolume:
    enabled: true
    storageClass: managed-csi
    size: 10Gi

# kube-state-metrics sub-chart — exposes Deployment / Pod state as metrics.
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
  updateStrategy:
    type: RollingUpdate

# RBAC + SA for scraping the AKS API server.
rbac:
  create: true
serviceAccount:
  create: true
  name: prometheus
  annotations: {}
