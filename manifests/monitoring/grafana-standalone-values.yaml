# ----------------------------------------------------------------------------
# Optional: standalone Helm values for Grafana if you choose to install it
# *separately* from kube-prometheus-stack (not required — the stack ships it).
#
# Use case: you want a dedicated Grafana install with more control over the
# deployment vs the one bundled in the kube-prometheus-stack chart.
# Install with:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install grafana grafana/grafana \
#     --namespace monitoring \
#     --values grafana-standalone-values.yaml
# ----------------------------------------------------------------------------

replicaCount: 1

# Admin credentials. Override via Secret or values file for real environments.
adminUser: admin
adminPassword: admin123

# Image — default upstream Grafana OSS image pinned for reproducibility.
image:
  repository: grafana/grafana
  tag: "10.4.2"
  pullPolicy: IfNotPresent

# Ingress — expose Grafana UI via NGINX Ingress Controller.
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: grafana.sock-shop.example.com
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: grafana-tls
  #     hosts:
  #       - grafana.sock-shop.example.com

# Persistent storage — Azure Disk (managed-csi StorageClass).
persistence:
  enabled: true
  storageClassName: managed-csi
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  finalizers:
    - kubernetes.io/pvc-protection

# Resource caps — suitable for a demo / small production footprint.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Sidecars auto-import ConfigMaps labelled grafana_datasource=1 or
# grafana_dashboard=1. See grafana-datasource.yaml and dashboard ConfigMaps.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    provider:
      foldersFromFilesStructure: true
      allowUiUpdates: true
  datasources:
    enabled: true
    label: grafana_datasource
    labelValue: "1"

# Datasource plugins pre-installed. Grafana auto-downloads these at boot.
plugins:
  - grafana-piechart-panel
  - natel-discrete-panel

# Security context for the Grafana container — restricted PSA compatible.
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# RBAC: Grafana SA needs list/watch on ConfigMaps for the sidecar.
rbac:
  create: true
  namespaced: false
  pspEnabled: false

serviceAccount:
  create: true
  name: grafana
  autoMount: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Disable Grafana built-in anonymous auth by default; require login.
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
  auth:
    disable_login_form: false
  auth.anonymous:
    enabled: false
  security:
    allow_embedding: true
  analytics:
    reporting_enabled: false
    check_for_updates: false
