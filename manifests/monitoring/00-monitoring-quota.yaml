# ResourceQuota for the monitoring namespace. Caps Prometheus + Grafana usage
# so they do not starve application pods on the AKS cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "40"
    persistentvolumeclaims: "8"
    services: "20"
---
# LimitRange applies defaults to monitoring Pods that do not set resources.
# Prometheus operator creates many small Pods (admission webhooks, etc.);
# these defaults prevent them running unbounded.
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: 10m
        memory: 32Mi
