# ----------------------------------------------------------------------------
# Grafana Dashboard ConfigMap: Sock Shop Application Performance
#
# Business + RED metrics (Rate, Errors, Duration) for each microservice.
# The sidecar imports this automatically when the ConfigMap appears.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sock-shop-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Sock Shop Application"
data:
  sock-shop-app-performance.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "uid": "sock-shop-app",
      "title": "Sock Shop · Application Performance",
      "tags": ["sock-shop", "application", "red-metrics"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "uid": "prometheus-aks" }
          },
          {
            "name": "service",
            "type": "custom",
            "current": { "text": "All", "value": ".*" },
            "options": [
              { "selected": true, "text": "All",   "value": ".*" },
              { "selected": false, "text": "carts", "value": "carts" },
              { "selected": false, "text": "orders", "value": "orders" },
              { "selected": false, "text": "catalogue", "value": "catalogue" },
              { "selected": false, "text": "front-end", "value": "front-end" },
              { "selected": false, "text": "payment", "value": "payment" },
              { "selected": false, "text": "shipping", "value": "shipping" },
              { "selected": false, "text": "user", "value": "user" },
              { "selected": false, "text": "queue-master", "value": "queue-master" }
            ],
            "includeAll": true,
            "multi": false,
            "query": "carts : carts, orders : orders, catalogue : catalogue, front-end : front-end, payment : payment, shipping : shipping, user : user, queue-master : queue-master"
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Requests / sec (all services)",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"sock-shop\", app=~\"$service\"}[5m])) or sum(rate(rabbitmq_queue_messages_total[5m]))",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "stat",
          "title": "Error Rate (%)",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"sock-shop\", app=~\"$service\", status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"sock-shop\", app=~\"$service\"}[5m])) * 100",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "thresholds": { "steps": [
            {"color": "green","value": null},{"color": "yellow","value": 1},{"color": "red","value": 5}
          ] } } }
        },
        {
          "type": "stat",
          "title": "p95 Response Latency (s)",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"sock-shop\", app=~\"$service\"}[5m])) by (le))",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Request Rate per Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum by (app) (rate(http_server_requests_seconds_count{namespace=\"sock-shop\", app=~\"$service\"}[5m]))",
            "refId": "A",
            "legendFormat": "{{app}}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "type": "timeseries",
          "title": "Response Time p50 / p95 / p99 (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{namespace=\"sock-shop\", app=~\"$service\"}[5m])) by (le, app))",
              "refId": "A",
              "legendFormat": "p50 {{app}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"sock-shop\", app=~\"$service\"}[5m])) by (le, app))",
              "refId": "B",
              "legendFormat": "p95 {{app}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"sock-shop\", app=~\"$service\"}[5m])) by (le, app))",
              "refId": "C",
              "legendFormat": "p99 {{app}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Container CPU Usage (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"sock-shop\", image!=\"\"}[5m]))",
            "refId": "A",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "timeseries",
          "title": "Container Memory Working Set (bytes)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"sock-shop\", image!=\"\"})",
            "refId": "A",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "title": "RabbitMQ · Queue Depth",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "rabbitmq_queue_messages{namespace=\"sock-shop\"}",
            "refId": "A",
            "legendFormat": "{{queue}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "type": "timeseries",
          "title": "MongoDB · Active Connections",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "rabbitmq_connections or container_network_tcp_usage_total{namespace=\"sock-shop\", pod=~\"\\.*db.*\"}",
            "refId": "A",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
      ]
    }
