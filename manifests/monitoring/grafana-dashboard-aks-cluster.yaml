# ----------------------------------------------------------------------------
# Grafana Dashboard ConfigMap: AKS Cluster Overview
#
# High-level cluster health panel set.
# Label `grafana_dashboard=1` triggers the Grafana sidecar to provision this.
# The sidecar will import the dashboard into the provisioned folder.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-aks-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "AKS Cluster Monitoring"
data:
  aks-cluster-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "uid": "aks-cluster-overview",
      "title": "AKS Cluster Overview",
      "tags": ["aks", "cluster", "infrastructure"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "uid": "prometheus-aks" },
            "refresh": 1,
            "includeAll": false
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "uid": "prometheus-aks" },
            "query": "label_values(kube_namespace_status_phase, namespace)",
            "includeAll": true,
            "multi": false,
            "refresh": 1,
            "sort": 1,
            "current": { "text": "sock-shop", "value": "sock-shop" }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Cluster Node Count",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
            "refId": "A"
          }],
          "reduceOptions": { "calcs": ["lastNotNull"], "fields": "" }
        },
        {
          "type": "stat",
          "title": "Pods Running (namespace: $namespace)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum(kube_pod_status_phase{phase=\"Running\", namespace=~\"$namespace\"})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Cluster CPU Usage %",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) / sum(machine_cpu_cores) * 100",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 } }
        },
        {
          "type": "stat",
          "title": "Cluster Memory Usage %",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "(1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100",
            "refId": "A"
          }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 } }
        },
        {
          "type": "timeseries",
          "title": "CPU Usage per Node",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "avg by (instance) (rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) * 100",
            "refId": "A",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Memory Usage per Node",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "avg by (instance) (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
            "refId": "A",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "type": "timeseries",
          "title": "Pod Restart Count (namespace: $namespace)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])",
            "refId": "A",
            "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
          }]
        },
        {
          "type": "bar-gauge",
          "title": "Pod Status Count",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "sum by (phase) (kube_pod_status_phase{namespace=~\"$namespace\"})",
            "refId": "A",
            "legendFormat": "{{phase}}"
          }],
          "options": { "displayMode": "lcd" }
        },
        {
          "type": "table",
          "title": "Pods Not Ready",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "uid": "prometheus-aks" },
          "targets": [{
            "expr": "kube_pod_status_ready{condition=\"false\", namespace=~\"$namespace\"} == 1",
            "refId": "A",
            "instant": true,
            "legendFormat": "{{namespace}}/{{pod}}"
          }],
          "transformations": [],
          "fieldConfig": { "defaults": {} }
        }
      ]
    }
