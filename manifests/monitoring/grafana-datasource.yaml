# ----------------------------------------------------------------------------
# Grafana Datasource: Prometheus (authenticated by label, picked up by the
# kube-prometheus-stack Grafana sidecar because the ConfigMap label is
# grafana_datasource=1).
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus-aks.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus-AKS
        type: prometheus
        access: proxy
        # Use the in-cluster Service DNS — Grafana and Prometheus both run
        # in namespace monitoring, so FQDN is optional but explicit is safer.
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        uid: prometheus-aks
        jsonData:
          timeInterval: 15s
          httpMethod: POST
          # Enable Grafana UI access to exemplar traces (optional — demo default off).
          exemplarTraceIdDestinations: []
        editable: false
