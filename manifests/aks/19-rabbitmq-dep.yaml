# rabbitmq Deployment — RabbitMQ 3.11 with management UI + Prometheus exporter sidecar.
# The exporter exposes /metrics on port 9090 which Prometheus scrapes.
# WARNING: Default user/pass is guest/guest — fine for demos, rotate in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: sock-shop
  labels:
    name: rabbitmq
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: rabbitmq
  template:
    metadata:
      labels:
        name: rabbitmq
        app: rabbitmq
      annotations:
        # Prometheus scrapes the exporter SIDECAR (not the broker directly).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.11.19-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: sock-shop-creds
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: sock-shop-creds
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # RabbitMQ must write to /var/lib/rabbitmq — leave RO=false for the broker.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
        # --- RabbitMQ Prometheus exporter sidecar ----------------------------
        - name: rabbitmq-exporter
          image: kbudde/rabbitmq-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: exporter
              containerPort: 9090
              protocol: TCP
          env:
            - name: RABBIT_URL
              value: "http://127.0.0.1:15672"
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: sock-shop-creds
                  key: rabbitmq-username
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sock-shop-creds
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: rabbitmq-data
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
