# Kubernetes Namespace for the Sock Shop microservices demo.
# All application resources are scoped to this namespace to provide
# isolation, RBAC boundary, and ResourceQuota enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
  labels:
    # PSA labels: enforce the "restricted" Pod Security Standard (best practice for AKS).
    # Pods that violate restricted (runAsRoot, privileged, etc.) will be REJECTED at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.29
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.29
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.29
    # Prometheus / monitoring discovery label.
    # Prometheus scrape configs can target namespaces with this label.
    monitoring: enabled
