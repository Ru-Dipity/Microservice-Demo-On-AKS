# rabbitmq Service — ClusterIP exposing AMQP (5672) and exporter (9090).
# Management port 15672 is intentionally NOT exposed externally; access via
#   kubectl port-forward svc/rabbitmq 15672:15672 -n sock-shop
# and open http://localhost:15672 (guest/guest by default).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: sock-shop
  labels:
    name: rabbitmq
    app: rabbitmq
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: exporter
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: management
      port: 15672
      targetPort: 15672
      protocol: TCP
  selector:
    name: rabbitmq
