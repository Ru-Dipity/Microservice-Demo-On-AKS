# front-end Ingress — exposes the Sock Shop UI via NGINX Ingress Controller.
#
# REQUIRES: AKS cluster has NGINX Ingress Controller installed.
#   az aks enable-addons -a ingress-appgw-routing  (Application Gateway Ingress)
#   OR helm install ingress-nginx via Helm.
#
# CHANGE "sock-shop.example.com" to your real DNS hostname, or add a
# nip.io / sslip.io name for quick testing, e.g.
#   host: sock-shop.<INGRESS_EXTERNAL_IP>.nip.io
#
# For TLS, add cert-manager + ClusterIssuer and add `tls:` with a secretName.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sock-shop-frontend
  namespace: sock-shop
  labels:
    app: front-end
  annotations:
    # --- NGINX Ingress Controller annotations -----------------------------
    # Rewrite /path to /path — leave root path alone.
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Reasonable timeouts for the demo SPA.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Enable compression for JS/CSS payloads.
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    # --- Application Gateway Ingress Controller (if used) -----------------
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
    # appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    # Cert-manager integration (uncomment when cert-manager is installed):
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
    # Use NGINX class by default; switch to "azure/application-gateway" if using AGIC.
    kubernetes.io/ingress.class: "nginx"
spec:
  # tls:  # Uncomment once you have a real cert / cert-manager
  #   - hosts:
  #       - sock-shop.example.com
  #     secretName: sock-shop-tls
  rules:
    - host: sock-shop.example.com   # <<< REPLACE WITH YOUR HOSTNAME >>>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-end
                port:
                  name: http
