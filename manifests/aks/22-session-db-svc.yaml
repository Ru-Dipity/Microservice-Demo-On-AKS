# session-db Service — ClusterIP 6379 -> container 6379.
apiVersion: v1
kind: Service
metadata:
  name: session-db
  namespace: sock-shop
  labels:
    name: session-db
    app: session-db
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    name: session-db
