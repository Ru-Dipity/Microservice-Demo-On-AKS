# Centralised Secret holding ALL database credentials consumed by the microservices.
# Every Deployment references these values via secretKeyRef to avoid hardcoding.
#
# IMPORTANT: Values below are BASE64-encoded. To rotate:
#   printf "newvalue" | base64 -w0
# Then re-apply and `kubectl rollout restart deployment/<name> -n sock-shop`.
#
# For production AKS, strongly consider Azure Key Vault Provider for Secrets Store CSI
# Driver (AKV to K8s Secret sync) instead of static base64 secrets.
apiVersion: v1
kind: Secret
metadata:
  name: sock-shop-creds
  namespace: sock-shop
  labels:
    app: sock-shop
type: Opaque
data:
  # --- MongoDB shared credentials (carts-db / orders-db) -------------------
  # default: "sock-user"
  mongodb-username: c29jay11c2Vy
  # default: "secretpassword123"
  mongodb-password: c2VjcmV0cGFzc3dvcmQxMjM=

  # --- MariaDB credentials (catalogue-db) ----------------------------------
  # MariaDB root user. Catalogue DSN connects as root with admin password.
  mariadb-root-username: cm9vdA==
  # default: "admin" (must match DSN in catalogue Deployment args)
  mariadb-root-password: YWRtaW4=

  # --- MongoDB user-db credentials (user service) --------------------------
  # user-db image auto-creates this user on first start if data dir is empty.
  userdb-username: c29jay11c2Vy
  userdb-password: c2VjcmV0cGFzc3dvcmQxMjM=
  userdb-database: c29ja3NkYg==

  # --- RabbitMQ credentials (shipping / queue-master) ----------------------
  rabbitmq-username: Z3Vlc3Q=
  rabbitmq-password: Z3Vlc3Q=

  # --- Grafana admin (optional — used by monitoring overlay) ---------------
  grafana-admin-user: YWRtaW4=
  grafana-admin-password: YWRtaW4xMjM=
