# ResourceQuota caps aggregate resource usage inside the sock-shop namespace.
# This prevents the demo from starving other workloads on the AKS cluster.
# Adjust values upwards if you scale replicas beyond the defaults.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sock-shop-quota
  namespace: sock-shop
spec:
  hard:
    # CPU / memory totals across all Pods in the namespace.
    # Baseline for 1 replica each of the 14 services + 2 monitoring sidecars.
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    # Object count caps to guard against accidental resource explosions.
    pods: "50"
    persistentvolumeclaims: "10"
    services: "30"
    configmaps: "20"
    secrets: "20"
---
# LimitRange applies DEFAULT requests/limits and MIN/MAX constraints to every Pod
# that does not specify them explicitly. Catches "naked" containers that would
# otherwise consume unbounded resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: sock-shop-limits
  namespace: sock-shop
spec:
  limits:
    # Container-level defaults applied when a container omits resources entirely.
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: 10m
        memory: 32Mi
