---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    name: user
spec:
  replicas: 1
  selector:
    matchLabels:
      name: user
  template:
    metadata:
      labels:
        name: user
    spec:
      containers:
        - name: user
          image: quay.io/powercloud/sock-shop-user:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 300m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          ports:
            - containerPort: 8080
          command: [ "/opt/user" ]
          args:
            - -port=8080
            - -mongo-host=user-db:27017
            - -mongo-user=sock-user
            - -mongo-password=password
          env:
            - name: mongo
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: user_mongo_host
            - name: HATEAOS
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: user_hateaos
            - name: USER_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: user_database
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 3
