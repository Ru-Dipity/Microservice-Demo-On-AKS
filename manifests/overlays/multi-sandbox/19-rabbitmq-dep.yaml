---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      name: rabbitmq
  template:
    metadata:
      labels:
        name: rabbitmq
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.11.19-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 15672
              name: management
            - containerPort: 5672
              name: rabbitmq
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: rabbitmq-data
        - name: rabbitmq-exporter
          image: kbudde/rabbitmq-exporter
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: exporter
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
      volumes:
        - name: rabbitmq-data
          emptyDir:
            medium: Memory
